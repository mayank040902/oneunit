name: auth

# `paths` is not evaluated for tag pushes, which is what makes a release tag
# reach the publish job below: tag auth-v<version> and GitHub runs this
# workflow, the verify and consumer-smoke jobs gate the publish, and the
# publish job checks that the tag matches package.json before uploading.
on:
  push:
    branches: [main]
    paths:
      - "packages/auth/**"
      - ".github/workflows/auth.yml"
  pull_request:
    paths:
      - "packages/auth/**"
      - ".github/workflows/auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json "engines".
        node: ["20", "22", "24"]

    defaults:
      run:
        working-directory: packages/auth

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Pack check
        run: pnpm run pack:check

      - name: Audit
        run: pnpm audit --audit-level high

  publish-dry-run:
    name: Consumer smoke test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and pack
        run: |
          pnpm --filter @oneunit/auth run build
          pnpm --filter @oneunit/auth pack --pack-destination "$RUNNER_TEMP"

      # A published package is only correct if it works when installed, so this
      # installs the real tarball and exercises the public API against it. It
      # also catches examples that import from a path npm does not ship.
      - name: Install the tarball into a clean project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          npm install "$RUNNER_TEMP"/oneunit-auth-*.tgz

      - name: Verify the public API
        run: |
          cat > "$RUNNER_TEMP/consumer/smoke.mjs" <<'EOF'
          import assert from "node:assert/strict";
          import {
            createAuth,
            matchPermission,
            isValidExpiresIn,
            UnauthorizedError,
          } from "@oneunit/auth";

          const auth = createAuth({
            secret: "x".repeat(32),
            rbac: { roles: { user: { permissions: ["a.read"] } } },
          });

          const session = await auth.login({ id: 1, roles: ["user"] });
          assert.deepEqual(session.payload.permissions, ["a.read"]);
          assert.equal((await auth.verify(session.accessToken)).sub, "1");

          await assert.rejects(() => auth.verify(session.refreshToken), UnauthorizedError);

          await auth.refresh(session.refreshToken);
          await assert.rejects(() => auth.refresh(session.refreshToken), UnauthorizedError);

          assert.equal(matchPermission("a.**", "a.b.c"), true);
          assert.equal(isValidExpiresIn("15m"), true);
          assert.equal(isValidExpiresIn("1y"), false);

          console.log("public API OK");
          EOF
          cd "$RUNNER_TEMP/consumer"
          node smoke.mjs

      - name: Verify shipped examples resolve
        working-directory: ${{ runner.temp }}/consumer
        run: |
          for example in standalone express fastify uwebsockets oauth-social sessions; do
            npx --yes tsx "node_modules/@oneunit/auth/examples/$example.ts"
          done

  # Publishing is driven by a tag, never by a push to main. The tag is the
  # release record: `git tag auth-v2.0.0 && git push origin auth-v2.0.0`.
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify, publish-dry-run]
    if: startsWith(github.ref, 'refs/tags/auth-v')

    # id-token: write is what makes npm Trusted Publishing work: the runner
    # exchanges this OIDC identity for a short-lived publish token, so there is
    # no long-lived npm secret in this repo. Configure the trusted publisher on
    # npmjs.com (package settings -> Trusted Publisher) with the repository
    # "mayank040902/framework" and this workflow filename. If you would rather
    # not set that up, delete the `permissions` block above and use a
    # repository secret NPM_TOKEN instead, as shown in the commented step.
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: packages/auth

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile

      # npm refuses to reuse a version number, so a typo in the tag would
      # produce a failed release that cannot simply be retried. Fail here with
      # a clear message instead.
      - name: Tag must match the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#auth-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag: $TAG_VERSION, package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # prepublishOnly runs build && test, so a failing test blocks the release.
      - name: Publish
        run: pnpm publish --access public --no-git-checks
        # Uncomment only if you are using an NPM_TOKEN secret instead of
        # Trusted Publishing:
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Confirm it is live
        run: |
          PUBLISHED="$(npm view @oneunit/auth version)"
          echo "published: $PUBLISHED"
          if [ "$PUBLISHED" != "$TAG_VERSION" ]; then
            echo "::error::registry reports $PUBLISHED, expected $TAG_VERSION"
            exit 1
          fi
